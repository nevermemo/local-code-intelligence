[package]
name = "lci-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1.92"
dirs = "6"
dunce = "1"
globset = "0.4"
hyper = { version = "1", default-features = false, features = ["client", "http1"] }
ignore = "0.4"
# The file watcher of `[run_profile.lsp] sync = "watch"` (`lsp/sync.rs`):
# ReadDirectoryChangesW, inotify or FSEvents, with a polling fallback. CC0-1.0.
notify = "8.2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
toml = "0.9"
tracing = "0.1"
tree-sitter = "0.25"
tree-sitter-c = "0.24.2"
tree-sitter-c-sharp = "0.23.5"
tree-sitter-cpp = "0.23.4"
tree-sitter-go = "0.25"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"

# Language servers run in a Job Object so that ending one ends its whole
# process tree (`lsp/job.rs`). 0.61 is the version already in Cargo.lock. Each
# feature gates the module of the calls `job.rs` makes, and nothing else:
# Foundation (HANDLE, INVALID_HANDLE_VALUE), Security (the SECURITY_ATTRIBUTES
# type in CreateJobObjectW's signature), System_JobObjects (create, configure,
# assign, terminate, query), System_Threading (CREATE_SUSPENDED, OpenThread,
# ResumeThread, and IO_COUNTERS inside the job's limit struct),
# System_Diagnostics_ToolHelp (the thread snapshot that finds the suspended
# process's thread to resume).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
