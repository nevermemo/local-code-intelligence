[package]
name = "lci-maps"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# The multimap spike's map layer (slice S2): the `Map` trait, the registry
# with fail-open, the fusion loop and the contract kit. Depends on `lci-core`
# only; maps that touch LanceDB live in the root crate. Every dependency is
# already in Cargo.lock.
[dependencies]
async-trait = "0.1.92"
futures = "0.3"
lci-core = { path = "../lci-core" }
serde_json = "1"
tokio = { version = "1", features = ["time", "macros", "rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
