# cargo-nextest profiles (optional; `cargo install cargo-nextest --locked`).
# `cargo nextest run --workspace --profile ci` retries a failed test once and
# reports it as flaky, ends a test that runs past 5 minutes, and runs the
# language-server, model-client and process tests at most two at a time.

[profile.ci]
retries = 1
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
heavy = { max-threads = 2 }

[[profile.ci.overrides]]
filter = 'test(/^navigation::/) | test(/^models::tests::/) | test(/probe/) | test(/git_history/)'
test-group = 'heavy'
