# cargo-nextest profiles (optional; `cargo install cargo-nextest --locked`).
# The default profile (used by `cargo xtask test --suite Full` when nextest is
# installed) has no retries, ends a test that runs past 10 minutes, and runs
# the language-server, model-client and process tests at most four at a time.
# `--profile ci` also retries a failed test once and reports it as flaky, and
# ends a test that runs past 5 minutes.

[profile.default]
slow-timeout = { period = "120s", terminate-after = 5 }

[profile.ci]
retries = 1
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 5 }

[test-groups]
heavy = { max-threads = 4 }

[[profile.default.overrides]]
filter = 'test(/^navigation::/) | test(/^models::tests::/) | test(/probe/) | test(/git_history/)'
test-group = 'heavy'
