name: Close landed Copilot PRs

# Copilot cloud agent PRs are landed by hand (diff-apply plus a commit whose message says
# "Copilot cloud agent PR #N"), so GitHub never marks them merged. After each push to
# main this closes every still-open Copilot PR that a recent commit names, with a
# comment pointing at the commit, and deletes its copilot/* branch. Scanning the last
# SCAN_DEPTH commits (not only the pushed range) makes the first run close the backlog too;
# closing is idempotent.

on:
  push:
    branches: [main]

permissions:
  contents: write       # delete the copilot/* head branch
  pull-requests: write  # comment and close

concurrency:
  group: close-landed-copilot-prs
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 80
      - name: Close Copilot PRs whose change landed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
          SCAN_DEPTH: "60"
        run: bash .github/scripts/close-landed-copilot-prs.sh
