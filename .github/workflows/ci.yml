name: CI

on:
  push:
    branches: [main]
  pull_request:

# Automated tests use only a local mock model HTTP service and a fake LSP
# binary built as part of the workspace (see tests/support). They never
# contact ports 8765/8766/8767 or a real rust-analyzer/csharp-ls, so this
# workflow needs no external services. Live model/LSP acceptance
# (`cargo xtask acceptance <name>`) is intentionally not run here: it
# requires locally running embedding/reranker services and, for the C#
# subcommands, a real dotnet SDK + csharp-ls install.
#
# Toolchains. The blocking `test` jobs build with the exact version in
# RUST_PIN, the one the last green run resolved from `stable`, so an
# unchanged commit cannot turn red because a new Rust release or a new
# default clippy lint came out. Two more jobs watch the two ends:
# `minimum-version` builds with the `rust-version` the manifests declare
# (keep it equal to Cargo.toml and lci-core/Cargo.toml), and `canary` runs
# clippy and the unit tests on the newest stable without blocking. A red
# canary means: bump RUST_PIN on purpose and record the bump as a roadmap
# row. There is no rust-toolchain file on purpose: it would also change the
# toolchain of every contributor's local builds.
# The jobs only check out and run cargo: a read-only token is enough.
permissions:
  contents: read

env:
  RUST_PIN: 1.99.0

jobs:
  # Windows first during development (d381): the tests run on Windows only.
  # Linux and macOS test runs return in cycle 2 (d403); their support is
  # decided closer to a release.
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (the toolchain is the `toolchain` input)
        with:
          toolchain: ${{ env.RUST_PIN }}
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # The lexical channel runs ripgrep and the integration tests exercise
      # it: a runner without `rg` fails 24 of them with "Lexical retrieval
      # unavailable". Install it, then print its version so a missing or
      # shadowed binary fails in one clear step.
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep --no-progress -y

      - name: Provision protoc (Windows)
        if: runner.os == 'Windows'
        run: cargo xtask setup

      - name: Check ripgrep
        run: rg --version

      - name: Build and test
        run: cargo xtask test --suite Full

  # The declared minimum Rust version builds the whole workspace with the
  # committed lockfile: a newer-only library API or a dependency that needs a
  # newer compiler turns this job red, and only this one.
  minimum-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (the toolchain is the `toolchain` input)
        with:
          toolchain: "1.95"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install protoc and cmake
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake

      - name: Check with the declared minimum version
        run: cargo check --workspace --locked --all-targets

  # The newest stable, for early warning only: it never fails the workflow.
  canary:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable (the toolchain is the `toolchain` input)
        with:
          toolchain: stable
          components: clippy

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install protoc, cmake and ripgrep
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler cmake ripgrep

      - name: Clippy on the newest stable
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Unit tests on the newest stable
        run: cargo xtask test --suite Unit
