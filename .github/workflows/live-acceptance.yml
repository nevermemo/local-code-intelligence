name: Live Acceptance

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# Runs the live acceptance/evaluation suite (`cargo xtask live-acceptance`:
# every `cargo xtask acceptance <name>` step, then `evaluate
# ./evaluations/core.toml`) against real locally running embedding/reranker
# services and real language-server executables. Those services live on the
# machine registered as the self-hosted runner below, not in this workflow --
# see docs/development/live-acceptance-ci.md for what to install and how to
# register the runner. Deliberately never triggers on `pull_request`: a
# self-hosted runner must not execute code from an untrusted fork PR, and the
# `test (windows-latest)` job in ci.yml is the only merge gate, so nothing in
# this workflow can block a pull request.
# The job only checks out and runs cargo: a read-only token is enough.
permissions:
  contents: read

concurrency:
  group: live-acceptance
  cancel-in-progress: false

jobs:
  live:
    runs-on: [self-hosted, lci-live]
    # Generous headroom: a real run building from a clean checkout, then
    # indexing a real external Cargo workspace for the rust-analyzer LSP
    # flow (documented elsewhere as "2 to 10+ minutes" of embedding time
    # alone), then all the languages' full/isolation/recovery LSP triples
    # plus the retrieval-quality evaluation, was observed taking a bit
    # over an hour end to end on first real measurement -- the original
    # 60-minute bound cut a fully-passing run off right at the finish
    # line (all acceptance steps green; only Evaluate + cleanup were cut
    # off). 150 minutes leaves real slack over that observed number. The
    # orchestrator also bounds each step by its own timeout.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # One orchestrated run instead of one workflow step per acceptance
      # subcommand. A step whose tool is missing (rust-analyzer, pyright,
      # gopls, jdtls, clangd, marksman, ...) prints PREREQUISITE_UNAVAILABLE
      # and exits 0, so run one by one it read as a green step. With
      # --require-all the orchestrator counts such a skip as a failure and
      # exits non-zero: this runner is registered to host every tool in the
      # docs/development/live-acceptance-ci.md prerequisites table, so a
      # missing one is a broken runner, not an optional channel.
      #
      # The orchestrator builds (`build --workspace --exclude xtask`), gives
      # every fixture a run-unique root under the temp directory and removes
      # only that root when the run ends, writes per-step logs and
      # summary.txt under test-results/live-acceptance-logs/, and prints the
      # tail of every step that did not pass. Like the previous per-step
      # workflow it never kills processes by name: this runner is a
      # developer machine, and an orphan left by a crashed run needs a human
      # look at the process list.
      - name: Live acceptance and evaluation (every tool required)
        run: cargo xtask live-acceptance --require-all
