# This file describes behaviour. Machine-specific values -- data_dir, port, the
# model URLs and names, ripgrep_path, rust_analyzer_path and the language-server
# sections below -- can also be set per machine, outside this file, so it can
# be shared unchanged: in a local overlay file beside it (config.local.toml for
# config.toml; the same keys, nothing else) or in LCI_* environment variables
# (LCI_DATA_DIR, LCI_PORT, ...). Both win over this file; the environment wins
# over the overlay. `lci config` prints every resolved value with the layer it
# came from, and `lci init` writes the overlay for this machine (the data
# directory, the absolute path of each tool on PATH) with comments on the
# model services and the port; it never edits this file. Details: the
# Configuration section of the README.
embedding_url = "http://localhost:8766/v1"
embedding_model = "qwen3-embedding-4b"
reranker_url = "http://localhost:8767/rerank"
reranker_model = "qwen3-reranker-4b"
default_top_k = 8
# Defaults to the OS-native local data directory joined with
# "local-code-intelligence": %LOCALAPPDATA% on Windows, ~/Library/Application
# Support on macOS, $XDG_DATA_HOME or ~/.local/share on Linux, which is
# usually right. Must be absolute and outside every workspace you index. To
# place it for this machine only, set data_dir in the local overlay or
# LCI_DATA_DIR instead of here.
# data_dir = '/absolute/path/outside/every/indexed/workspace'
# Loopback port `serve` binds (127.0.0.1). 8765, 8766 and 8767 belong to other
# services and are rejected. `serve --port` overrides it.
port = 8768
embedding_batch_size = 8
# Prompt formats for the embedding model. Models differ in what they expect (an
# instruction prefix, a task label), so the text embedded for a query and for an
# indexed chunk are both templates. The defaults below are the formats LCI used
# before they were configurable (Qwen3-Embedding's query instruction, the bare
# code for documents).
#
# embedding_query_template is the text embedded for a search query. {query} is
# required. It shapes the query only, so changing it never re-embeds an index.
embedding_query_template = "Instruct: Given a code search query, retrieve relevant code passages that answer the query\nQuery: {query}"
# embedding_document_template is the text embedded for each indexed chunk.
# {code} (the chunk's source) is required; {path} (its repository-relative file
# path) is optional. Changing it changes the index's embedding identity, so
# every chunk is re-embedded: the next index_workspace does it, and so does a
# search under the default on-search freshness (under manual or watch a search
# fails until you re-index). Without {path}, identical code is embedded once
# and reused wherever it appears; with {path} the vector depends on the file
# too, so identical code in different files, or a file moved to a new path, is
# embedded per path.
# Placeholders are filled in one pass: code that contains the text {path} is
# embedded literally, and any other {text} in a template is kept as it is.
embedding_document_template = "{code}"
# EmbeddingGemma 2 (set both):
# embedding_query_template = "task: code retrieval | query: {query}"
# embedding_document_template = "title: {path} | text: {code}"
# bge-code-v1 (set both; the document format is the bare code):
# embedding_query_template = "<instruct>Given a question in text, retrieve relevant code that answers it.\n<query>{query}"
# embedding_document_template = "{code}"
embedding_timeout_seconds = 120
reranker_timeout_seconds = 120
# Bounded timeout for /ready and service_status dependency probes (1-30 seconds).
readiness_timeout_seconds = 5
ripgrep_path = "rg"
semantic_candidate_count = 40
lexical_candidate_count = 40
# Candidates kept after fusion: the reranker's window, and the most results a
# search returns even when top_k asks for more (a top_k passed above it adds
# a note to the response). A search profile may set its own (1-200).
rerank_candidate_count = 24
# Most bytes of code sent to the reranker per candidate (256-1048576).
rerank_document_max_bytes = 4096
rrf_k = 60.0
# Used only after watch_workspace is called for a workspace.
watch_poll_milliseconds = 2000
watch_debounce_milliseconds = 750
rust_analyzer_path = "rust-analyzer"
# Restore rust-analyzer's execution/network defaults only for trusted
# repositories and dependencies. Applies to every workspace this process uses.
rust_analyzer_trusted = false
# Seconds a request to a language server may go without any sign of life from
# it (1-86400).
lsp_timeout_seconds = 60
lsp_candidate_count = 40
# Most milliseconds one search waits for the language-server channel
# (100-60000). A server that is still starting (rust-analyzer takes ~10 s to
# index a workspace) or slow to answer costs a search at most this long: the
# search returns without symbol candidates, notes that in its "notes" field
# (not "warning": nothing failed), and the server keeps starting in the
# background so a later search uses it. Raise it to wait longer for a cold
# server; lsp_timeout_seconds separately bounds one request to a hung server.
lsp_search_budget_ms = 1500
# Seconds a language server may go unused before LCI shuts it down (through
# the protocol's shutdown request and exit notification: up to 2 seconds for
# the answer and 2 more for the process to end, then it is killed) to free its
# memory; 0 keeps every server until the service stops. Any search or
# navigation call for the workspace counts as use, and a server that is still
# building its symbol index or serving a call is never released. The next call
# after a release starts a fresh server, which pays the cold start and priming
# again, so a search right after a release can hit lsp_search_budget_ms and
# note it. Allowed: 0-86400; values below 60 are meant for tests.
lsp_idle_timeout_seconds = 1800

# Seconds a language server may answer nothing but transient "ask again"
# errors (ContentModified, ServerCancelled, RequestFailed, a loading server's
# own errors) before its session is replaced; the span runs from its first such
# answer, and any result, any other error, or a progress notification from the
# server ends it. A server that is still loading answers them for minutes and a
# restarted one starts the load over, so keep this above the longest load you
# expect. 0 never replaces a session for this.
# Allowed: 0-86400; values below 60 are meant for tests.
lsp_stuck_seconds = 900

# Optional C# language server (csharp-ls). C# tooling is optional and
# fail-open: omitting this section (or leaving path empty) keeps it disabled
# without affecting syntax retrieval. The shared lsp_timeout_seconds and
# lsp_candidate_count above also apply to the C# server.
# [csharp]
# path = "csharp-ls"
# args = []
# disabled = false

# Optional TypeScript/JavaScript language server (typescript-language-server,
# npm install -g typescript-language-server typescript). One configured
# server navigates .ts/.tsx/.js/.jsx. Optional and fail-open, same as csharp
# above. LCI always passes --stdio; args here are appended after it.
# [typescript]
# path = "typescript-language-server"
# args = []
# disabled = false

# Optional Python language server (pyright, npm install -g pyright, which
# provides pyright-langserver). Optional and fail-open, same as csharp above.
# LCI always passes --stdio; args here are appended after it.
# [python]
# path = "pyright-langserver"
# args = []
# disabled = false

# Optional Go language server (gopls, go install
# golang.org/x/tools/gopls@latest). Optional and fail-open, same as csharp
# above. Unlike csharp-ls/typescript-language-server/pyright, gopls needs no
# forced leading transport flag -- stdio is its default communication mode.
# Needs a go.mod at or above the workspace root to build its package graph.
# [go]
# path = "gopls"
# args = []
# disabled = false

# Optional Java language server (jdtls / Eclipse JDT Language Server).
# Unlike every other server above, path is the jdtls *installation
# directory* (e.g. an extracted jdt-language-server-*.tar.gz), not an
# executable -- LCI spawns java directly, finding the Equinox launcher jar
# and platform config dir under that directory itself. Optional and
# fail-open, same as csharp above.
# [java]
# path = "C:/tools/jdtls"
# args = []
# disabled = false

# Optional C/C++ language server (clangd). One configured server navigates
# both .c and .cpp/.hpp. Optional and fail-open, same as csharp above. Like
# gopls, clangd needs no forced leading transport flag. No compile_commands.json
# is needed for simple per-file navigation; point clangd at a real one via
# args (e.g. "--compile-commands-dir=...") for a workspace with a build system.
# [clangd]
# path = "clangd"
# args = []
# disabled = false

# Query-time switches for the retrieval channels and the reranker; all default
# to true, and a file without this section behaves exactly as before. A
# disabled channel is skipped outright: no candidates, no work (semantic =
# false never embeds the query; lsp = false never starts a language server), a
# zero timing, and no "unavailable" warning, because turning it off is a
# choice, not a failure. A disabled reranker returns the fusion order with
# reranked = false, sends no request, and adds no warning. At least one of
# semantic, lexical, and lsp must stay enabled, or the configuration is
# rejected at startup.
# The switches affect searches only. Indexing always embeds and stores every
# chunk, so flipping one never needs a reindex, and /ready and service_status
# keep probing the embedding service even with semantic = false, because
# indexing still needs it.
# Grep-only baseline for an evaluation arm (ripgrep matches mapped onto
# chunks, nothing else): semantic = false, lsp = false, reranker = false.
[channels]
semantic = true
lexical = true
lsp = true
reranker = true

# Named query-time profiles, [search_profiles.<name>]: none are configured by
# default, and a search that names none behaves exactly as it does without this
# section. A profile overrides only semantic, lexical, lsp, reranker (the same
# switches as [channels]) and rerank_candidate_count (1..=200); a key it leaves
# out keeps the top-level value above. Nothing that changes the index, the
# embedding identity, fusion, the candidate depths, the per-file cap, or
# rerank_document_max_bytes can be set here (an unknown key is an error), so
# every profile searches the same index. Each profile must keep at least one of
# semantic, lexical, and lsp enabled. A name is 1 to 32 letters, digits, "_" or
# "-" starting with a letter or digit, and "default" is reserved. Choose one
# with `search --search-profile <name>` on the command line; an unknown name is
# an error that lists the configured ones, never a silent fall back to the
# defaults. The response and the candidate dump then carry search_profile.
# Fusion order only, no rerank request:
# [search_profiles.fast]
# reranker = false
# Rerank a wider shortlist and leave the language servers out:
# [search_profiles.deep]
# lsp = false
# rerank_candidate_count = 48
#
# Four more profile keys change only how the MCP endpoint /mcp/<name> shows
# itself to an agent and never what a search retrieves; REST and the command
# line always return the full result:
#   tools = "full" (default) or "search": "search" lists and serves only
#     search_code, search_symbols, find_definition and find_references, not the
#     six maintenance tools (about a third of the tool list).
#   response = "full" (default) or "compact": "compact" makes search_code return
#     per hit only relative_file_path, start_line, end_line, language,
#     source_role and code, and a short envelope. The same hits in the same
#     order.
#   compact_max_hit_lines = 40 (1..=1000): a longer hit's code is cut after this
#     many lines and marked (code_truncated, excerpt_end_line, and a last line
#     naming the lines to read from the file).
#   compact_max_response_chars = 16000 (1000..=1000000): a ceiling on the whole
#     serialized result; code is shortened across hits (response_truncated), and
#     if even the locators do not fit the call fails and asks for a lower top_k.
# The two compact_* keys are an error without response = "compact". A search-only
# agent endpoint with the compact result (served at /mcp/agent):
# [search_profiles.agent]
# tools = "search"
# response = "compact"
# compact_max_hit_lines = 40
# compact_max_response_chars = 16000

# Per-channel weights for Reciprocal Rank Fusion. A channel adds
# weight / (rrf_k + rank) for each chunk it returns, and a chunk several
# channels return sums those terms; the source-role prior is added afterwards
# and is never scaled. All three weights default to 1.0, which is plain
# unweighted RRF. A semantic_weight of 2.0 was the default for a while
# (roadmap F2a) and was reverted: an exact offline replay with the LSP channel
# present found no significant effect, so the simpler plain RRF is the default.
# A file without this section uses the defaults. Set max_chunks_per_file to 0
# for plain RRF with no file cap, for example for an evaluation arm that must
# match earlier reports. Each weight must be finite and greater than zero: a
# zero weight is rejected at startup, because turning a channel off is what
# [channels] is for. The weights show up only in fusion_score; channel ranks and
# scores, and the reranker's input, are unchanged. rrf_k stays a top-level key.
#
# max_chunks_per_file (0..=100, default 2; 0 = unlimited, which leaves the
# fused order exactly as plain fusion gives it) caps how many chunks of one file
# keep their place in the fused order. A file's chunks beyond the cap are
# demoted, never dropped: they move behind every other chunk, both groups
# keeping their fused order, before the list is cut to rerank_candidate_count.
# The reranker's shortlist (and, with the reranker off or failing, the results)
# therefore fill with distinct files first, and top_k is still filled from the
# demoted chunks when there are too few files. fusion_score is not rescaled, so
# a demoted chunk can appear after a chunk with a lower fusion_score. The
# reranker's own output order is not capped again. The default of 2 was
# measured on the mined evaluation set and core (roadmap F2b): fusion-only
# nDCG@10 +0.049 on the mined set, significant in both halves, and +0.168 on
# core, significant; reranked on the mined set nDCG@10 +0.046 (significant) and
# MRR -0.023 (not significant).
[fusion]
semantic_weight = 1.0
lexical_weight = 1.0
lsp_weight = 1.0
max_chunks_per_file = 2

[index]
# manual: never refresh automatically; call index_workspace explicitly.
# on-search: refresh a stale snapshot on the first search that needs it (default for agents).
# watch: leave refresh to watch_workspace's background poller instead of checking on every search.
freshness = "on-search"
# Throttles filesystem staleness checks under "on-search" so repeated
# searches in the same unchanged workspace reuse the current snapshot.
stale_check_interval_seconds = 10
# How long a search waits for a concurrently running refresh job before
# falling back to the previous snapshot.
wait_for_existing_job_seconds = 120
