embedding_url = "http://localhost:8766/v1"
embedding_model = "qwen3-embedding-4b"
reranker_url = "http://localhost:8767/rerank"
reranker_model = "qwen3-reranker-4b"
default_top_k = 8
# Defaults to the OS-native local data directory joined with
# "local-code-intelligence": %LOCALAPPDATA% on Windows, ~/Library/Application
# Support on macOS, $XDG_DATA_HOME or ~/.local/share on Linux.
# Must be outside every workspace you index.
# data_dir = 'C:\Users\you\AppData\Local\local-code-intelligence'
embedding_batch_size = 8
embedding_timeout_seconds = 120
reranker_timeout_seconds = 120
# Bounded timeout for /ready and service_status dependency probes (1-30 seconds).
readiness_timeout_seconds = 5
ripgrep_path = "rg"
semantic_candidate_count = 40
lexical_candidate_count = 40
rerank_candidate_count = 24
# Most bytes of code sent to the reranker per candidate (256-1048576).
rerank_document_max_bytes = 4096
rrf_k = 60.0
# Used only after watch_workspace is called for a workspace.
watch_poll_milliseconds = 2000
watch_debounce_milliseconds = 750
rust_analyzer_path = "rust-analyzer"
lsp_timeout_seconds = 60
lsp_candidate_count = 40
# Most milliseconds one search waits for the language-server channel
# (100-60000). A server that is still starting (rust-analyzer takes ~10 s to
# index a workspace) or slow to answer costs a search at most this long: the
# search returns without symbol candidates, notes that in its "notes" field
# (not "warning": nothing failed), and the server keeps starting in the
# background so a later search uses it. Raise it to wait longer for a cold
# server; lsp_timeout_seconds separately bounds one request to a hung server.
lsp_search_budget_ms = 1500

# Optional C# language server (csharp-ls). C# tooling is optional and
# fail-open: omitting this section (or leaving path empty) keeps it disabled
# without affecting syntax retrieval. The shared lsp_timeout_seconds and
# lsp_candidate_count above also apply to the C# server.
# [csharp]
# path = "csharp-ls"
# args = []
# disabled = false

# Optional TypeScript/JavaScript language server (typescript-language-server,
# npm install -g typescript-language-server typescript). One configured
# server navigates .ts/.tsx/.js/.jsx. Optional and fail-open, same as csharp
# above. LCI always passes --stdio; args here are appended after it.
# [typescript]
# path = "typescript-language-server"
# args = []
# disabled = false

# Optional Python language server (pyright, npm install -g pyright, which
# provides pyright-langserver). Optional and fail-open, same as csharp above.
# LCI always passes --stdio; args here are appended after it.
# [python]
# path = "pyright-langserver"
# args = []
# disabled = false

# Optional Go language server (gopls, go install
# golang.org/x/tools/gopls@latest). Optional and fail-open, same as csharp
# above. Unlike csharp-ls/typescript-language-server/pyright, gopls needs no
# forced leading transport flag -- stdio is its default communication mode.
# Needs a go.mod at or above the workspace root to build its package graph.
# [go]
# path = "gopls"
# args = []
# disabled = false

# Optional Java language server (jdtls / Eclipse JDT Language Server).
# Unlike every other server above, path is the jdtls *installation
# directory* (e.g. an extracted jdt-language-server-*.tar.gz), not an
# executable -- LCI spawns java directly, finding the Equinox launcher jar
# and platform config dir under that directory itself. Optional and
# fail-open, same as csharp above.
# [java]
# path = "C:/tools/jdtls"
# args = []
# disabled = false

# Optional C/C++ language server (clangd). One configured server navigates
# both .c and .cpp/.hpp. Optional and fail-open, same as csharp above. Like
# gopls, clangd needs no forced leading transport flag. No compile_commands.json
# is needed for simple per-file navigation; point clangd at a real one via
# args (e.g. "--compile-commands-dir=...") for a workspace with a build system.
# [clangd]
# path = "clangd"
# args = []
# disabled = false

# Query-time switches for the retrieval channels and the reranker; all default
# to true, and a file without this section behaves exactly as before. A
# disabled channel is skipped outright: no candidates, no work (semantic =
# false never embeds the query; lsp = false never starts a language server), a
# zero timing, and no "unavailable" warning, because turning it off is a
# choice, not a failure. A disabled reranker returns the fusion order with
# reranked = false, sends no request, and adds no warning. At least one of
# semantic, lexical, and lsp must stay enabled, or the configuration is
# rejected at startup.
# The switches affect searches only. Indexing always embeds and stores every
# chunk, so flipping one never needs a reindex, and /ready and service_status
# keep probing the embedding service even with semantic = false, because
# indexing still needs it.
# Grep-only baseline for an evaluation arm (ripgrep matches mapped onto
# chunks, nothing else): semantic = false, lsp = false, reranker = false.
[channels]
semantic = true
lexical = true
lsp = true
reranker = true

# Per-channel weights for Reciprocal Rank Fusion. A channel adds
# weight / (rrf_k + rank) for each chunk it returns, and a chunk several
# channels return sums those terms; the source-role prior is added afterwards
# and is never scaled. The weights default to 1.0, which is plain RRF, and a
# file without this section ranks and scores exactly as before. Each weight
# must be finite and greater than zero: a zero weight is rejected at startup,
# because turning a channel off is what [channels] is for. The weights show up
# only in fusion_score; channel ranks and scores, and the reranker's input,
# are unchanged. rrf_k stays a top-level key.
[fusion]
semantic_weight = 1.0
lexical_weight = 1.0
lsp_weight = 1.0

[index]
# manual: never refresh automatically; call index_workspace explicitly.
# on-search: refresh a stale snapshot on the first search that needs it (default for agents).
# watch: leave refresh to watch_workspace's background poller instead of checking on every search.
freshness = "on-search"
# Throttles filesystem staleness checks under "on-search" so repeated
# searches in the same unchanged workspace reuse the current snapshot.
stale_check_interval_seconds = 10
# How long a search waits for a concurrently running refresh job before
# falling back to the previous snapshot.
wait_for_existing_job_seconds = 120
