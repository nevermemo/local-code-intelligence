# Git-mined retrieval queries for workspace "self".
#
# GENERATED by `cargo xtask mine-queries --repo <repo> --key self --out <file> --max 300`
# at HEAD 4c8a4fc08a610576076838b3b81b1a42316129c2. Do not edit it by hand and do not use it to tune ranking:
# it is a measurement, and regenerating it is the only way to change it.
#
# Each query is a commit message (the subject, plus the first body paragraph
# when that adds words). Merges, reverts, subjects under 4 words and
# formatting, lint or typo commits are skipped. `expected_paths` are the
# supported source files the commit touched that still exist at HEAD, followed
# through later renames; evaluation searches the checked-out tree, not the
# commit's parent, so a file may have changed since. That makes these labels
# an approximation, not ground truth.
#
# Tags: `keyword` means the query text names a touched file (its stem words,
# in any spelling) or contains a code-identifier-shaped token (snake_case,
# `::`, `--flag`, `/` between lowercase letters or digits, `.` between word
# characters, camelCase or PascalCase; common proper nouns like JavaScript
# do not count); `keyword-agnostic` means it does neither. `gold-drift` means
# more than half of the commit's changed lines (added plus deleted; a pure
# move counts on both sides) are in files that are not gold: unsupported or
# excluded files, deleted files, and files gone from HEAD even after later
# renames, so a miss may not be a retrieval failure. `short-query` means the
# query text has fewer than 8 words and `long-query` that it has
# 25 or more (query-text words, so an appended body paragraph counts).
# The report breaks the metrics out per tag. `top_k = 10` keeps the
# @10 metrics from being window-bound.
# The checked-in hand-written set stays evaluations/core.toml.

